<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Toyota Backend — Admin</title>
<style>
  :root {
    --bg: #0f1419;
    --panel: #1a212a;
    --panel-2: #232c38;
    --border: #2c3645;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #eb0a1e;
    --accent-hover: #c30819;
    --ok: #2ea043;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--panel); }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header .brand { color: var(--accent); font-weight: 700; }
  header .token-status { margin-left: auto; font-size: 12px; color: var(--muted); }
  nav { display: flex; gap: 2px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--border); overflow-x: auto; }
  nav button { background: transparent; border: 0; color: var(--muted); padding: 12px 18px; cursor: pointer; font-size: 13px; border-bottom: 2px solid transparent; }
  nav button.active { color: var(--text); border-bottom-color: var(--accent); }
  main { padding: 20px; max-width: 1400px; margin: 0 auto; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .toolbar input, .toolbar select { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 4px; font: inherit; }
  button.primary { background: var(--accent); color: white; border: 0; padding: 8px 14px; border-radius: 4px; cursor: pointer; font: inherit; font-weight: 500; }
  button.primary:hover { background: var(--accent-hover); }
  button.secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); padding: 6px 10px; border-radius: 4px; cursor: pointer; font: inherit; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 6px; overflow: hidden; }
  th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13px; }
  th { background: var(--panel-2); color: var(--muted); font-weight: 500; text-transform: uppercase; font-size: 11px; letter-spacing: 0.04em; }
  tr:last-child td { border-bottom: 0; }
  tr:hover td { background: var(--panel-2); }
  .edit-form { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 16px; margin-top: 16px; }
  .edit-form h3 { margin: 0 0 12px; font-size: 14px; }
  .edit-form .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
  .edit-form label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  .edit-form input, .edit-form select, .edit-form textarea { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); padding: 7px 9px; border-radius: 4px; font: inherit; }
  .edit-form textarea { min-height: 80px; resize: vertical; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; }
  .edit-form .actions { display: flex; gap: 8px; margin-top: 12px; }
  .ai-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 16px; }
  .ai-panel textarea { width: 100%; min-height: 80px; background: var(--panel-2); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 4px; font: inherit; resize: vertical; }
  .ai-answer { margin-top: 16px; background: var(--panel-2); border-radius: 4px; padding: 14px; white-space: pre-wrap; }
  .ai-meta { margin-top: 8px; font-size: 11px; color: var(--muted); display: flex; gap: 16px; flex-wrap: wrap; }
  .badge { display: inline-block; padding: 2px 7px; border-radius: 3px; background: var(--panel-2); font-size: 11px; color: var(--muted); }
  .empty { color: var(--muted); padding: 30px; text-align: center; }
  .danger { color: var(--accent); }
  .ok { color: var(--ok); }
  .row-actions { display: flex; gap: 6px; }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 20px; min-width: 320px; }
  dialog::backdrop { background: rgba(0,0,0,0.7); }
</style>
</head>
<body>
<header>
  <h1><span class="brand">Toyota</span> Backend</h1>
  <span class="token-status" id="tokenStatus">no token</span>
  <button class="secondary" onclick="changeToken()">change token</button>
</header>
<nav id="tabs"></nav>
<main id="main"></main>

<dialog id="tokenDialog">
  <h3 style="margin-top:0">Enter API token</h3>
  <p style="color: var(--muted); font-size: 12px;">Pasted from your <code>.env</code> file. Stored in localStorage.</p>
  <input type="password" id="tokenInput" style="width: 100%; background: var(--panel-2); border: 1px solid var(--border); color: var(--text); padding: 8px; border-radius: 4px; font: inherit;" />
  <div style="margin-top: 12px; display: flex; gap: 8px; justify-content: flex-end;">
    <button class="secondary" onclick="document.getElementById('tokenDialog').close()">cancel</button>
    <button class="primary" onclick="saveToken()">save</button>
  </div>
</dialog>

<script>
const TABS = ["ai", "search", "compare", "payments", "customers", "models", "trims", "options", "powertrains", "warranties", "finance", "promos", "incentives", "colors", "notes", "maintenance", "scrape"];
const TAB_LABELS = { ai: "AI Q&A", search: "Search", compare: "Compare", payments: "Payments", customers: "Customers", models: "Models", trims: "Trims", options: "Options", powertrains: "Powertrains", warranties: "Warranties", finance: "F&I Products", promos: "Promos", incentives: "Incentives", colors: "Colors", notes: "Rep Notes", maintenance: "Maintenance", scrape: "Scraper" };
let token = localStorage.getItem("toyota_token") || "";
let currentTab = location.hash.replace("#", "") || "ai";
if (!TABS.includes(currentTab)) currentTab = "ai";

function changeToken() {
  document.getElementById("tokenInput").value = token;
  document.getElementById("tokenDialog").showModal();
}
function saveToken() {
  token = document.getElementById("tokenInput").value.trim();
  localStorage.setItem("toyota_token", token);
  document.getElementById("tokenDialog").close();
  updateTokenStatus();
  render();
}
function updateTokenStatus() {
  const el = document.getElementById("tokenStatus");
  el.textContent = token ? `token: ${token.slice(0,6)}…${token.slice(-4)}` : "no token";
  el.className = "token-status" + (token ? " ok" : " danger");
}

async function api(path, opts = {}) {
  const res = await fetch("/api/v1" + path, {
    ...opts,
    headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json", ...(opts.headers || {}) },
  });
  if (!res.ok) {
    const body = await res.text();
    throw new Error(res.status + ": " + body);
  }
  if (res.status === 204) return null;
  return res.json();
}

function renderTabs() {
  const nav = document.getElementById("tabs");
  nav.innerHTML = TABS.map(t => `<button class="${t === currentTab ? 'active' : ''}" onclick="setTab('${t}')">${TAB_LABELS[t]}</button>`).join("");
}
function setTab(t) {
  currentTab = t;
  location.hash = t;
  render();
}

async function render() {
  renderTabs();
  if (!token) {
    document.getElementById("main").innerHTML = `<div class="empty">Set your API token to begin.</div>`;
    return;
  }
  try {
    if (currentTab === "ai") return renderAi();
    if (currentTab === "models") return renderModels();
    if (currentTab === "trims") return renderTrims();
    if (currentTab === "powertrains") return renderPowertrains();
    if (currentTab === "warranties") return renderWarranties();
    if (currentTab === "finance") return renderFinance();
    if (currentTab === "notes") return renderNotes();
    if (currentTab === "scrape") return renderScrape();
    if (currentTab === "compare") return renderCompare();
    if (currentTab === "search") return renderSearch();
    if (currentTab === "colors") return renderColors();
    if (currentTab === "payments") return renderPayments();
    if (currentTab === "promos") return renderPromos();
    if (currentTab === "incentives") return renderIncentives();
    if (currentTab === "options") return renderOptions();
    if (currentTab === "customers") return renderCustomers();
    if (currentTab === "maintenance") return renderMaintenance();
  } catch (e) {
    document.getElementById("main").innerHTML = `<div class="empty danger">Error: ${e.message}</div>`;
  }
}

// ---------- AI ----------
let _currentConversationId = null;

async function renderAi() {
  const { conversations } = await api("/ai/conversations");
  const convList = conversations.length === 0
    ? `<div class="empty" style="padding: 10px;">No conversations yet</div>`
    : conversations.map(c => `
        <div onclick="loadConversation(${c.id})" style="padding: 8px 10px; border-bottom: 1px solid var(--border); cursor: pointer; ${c.id === _currentConversationId ? 'background: var(--panel-2);' : ''}">
          <div style="font-size: 13px; ${c.id === _currentConversationId ? 'font-weight: 600;' : ''}">${escapeHtml(c.title || `#${c.id}`).slice(0, 50)}</div>
          <div style="font-size: 11px; color: var(--muted);">${c._count.messages} msg • ${new Date(c.updatedAt).toLocaleDateString()}</div>
        </div>`).join("");
  document.getElementById("main").innerHTML = `
    <div style="display: grid; grid-template-columns: 240px 1fr; gap: 16px; align-items: start;">
      <div style="background: var(--panel); border: 1px solid var(--border); border-radius: 6px;">
        <div style="padding: 10px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;">
          <strong style="font-size: 12px;">Conversations</strong>
          <button class="secondary" style="font-size: 11px; padding: 3px 8px;" onclick="newConversation()">+ new</button>
        </div>
        ${convList}
      </div>
      <div class="ai-panel">
        <h3 style="margin-top:0">${_currentConversationId ? `Conversation #${_currentConversationId}` : 'New conversation'}</h3>
        <div id="aiHistory"></div>
        <textarea id="aiQ" placeholder="e.g. Customer comparing 2026 RAV4 Hybrid XLE vs Highlander Hybrid LE — what should I emphasize on warranty and price?"></textarea>
        <div style="display: flex; gap: 8px; margin-top: 10px; align-items: center;">
          <label style="font-size: 12px; color: var(--muted);">Model:
            <select id="aiModel"><option value="haiku">haiku-4-5 (fast)</option><option value="sonnet">sonnet-4-6 (smarter)</option></select>
          </label>
          <button class="primary" onclick="aiAsk()">${_currentConversationId ? 'Send' : 'Ask'}</button>
          ${_currentConversationId ? `<button class="secondary" onclick="deleteConversation(${_currentConversationId})">Delete</button>` : ''}
        </div>
        <div id="aiOut"></div>
      </div>
    </div>`;
  if (_currentConversationId) await renderHistory();
}
function newConversation() { _currentConversationId = null; render(); }
async function loadConversation(id) { _currentConversationId = id; render(); }
async function deleteConversation(id) {
  if (!confirm("Delete conversation #" + id + "?")) return;
  await api(`/ai/conversations/${id}`, { method: "DELETE" });
  _currentConversationId = null;
  render();
}
async function renderHistory() {
  if (!_currentConversationId) return;
  const conv = await api(`/ai/conversations/${_currentConversationId}`);
  const el = document.getElementById("aiHistory");
  if (!el) return;
  el.innerHTML = conv.messages.map(m => `
    <div style="margin-bottom: 10px;">
      <div style="font-size: 11px; color: var(--muted); margin-bottom: 4px;">${m.role}${m.modelUsed ? ' · ' + m.modelUsed : ''}</div>
      <div class="ai-answer" style="margin: 0;">${escapeHtml(m.content)}</div>
    </div>`).join("");
}
async function aiAsk() {
  const question = document.getElementById("aiQ").value.trim();
  if (!question) return;
  const model = document.getElementById("aiModel").value;
  const out = document.getElementById("aiOut");
  out.innerHTML = `<div class="ai-answer">Thinking…</div>`;
  try {
    const body = { question, model };
    if (_currentConversationId) body.conversationId = _currentConversationId;
    const r = await api("/ai/ask", { method: "POST", body: JSON.stringify(body) });
    _currentConversationId = r.conversationId;
    document.getElementById("aiQ").value = "";
    render();
  } catch (e) {
    out.innerHTML = `<div class="ai-answer danger">${escapeHtml(e.message)}</div>`;
  }
}

// ---------- Generic CRUD UI ----------
function escapeHtml(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmt(v) { if (v == null) return "—"; if (typeof v === "object") return escapeHtml(JSON.stringify(v)); return escapeHtml(String(v)); }

async function renderModels() {
  const { models } = await api("/models");
  document.getElementById("main").innerHTML = `
    <div class="toolbar"><button class="primary" onclick="openModelForm()">+ New model</button></div>
    <table><thead><tr><th>ID</th><th>Slug</th><th>Name</th><th>Body</th><th>Segment</th><th>Trims</th><th></th></tr></thead>
    <tbody>${models.map(m => `<tr>
      <td>${m.id}</td><td><code>${m.slug}</code></td><td>${escapeHtml(m.name)}</td>
      <td>${fmt(m.bodyStyle)}</td><td>${fmt(m.segment)}</td><td>${m.trims?.length ?? 0}</td>
      <td class="row-actions">
        <button class="secondary" onclick='openModelForm(${JSON.stringify(m)})'>edit</button>
        <button class="secondary danger" onclick="delItem('models', ${m.id})">delete</button>
      </td></tr>`).join("")}</tbody></table>
    <div id="formArea"></div>`;
}
function openModelForm(m = {}) {
  document.getElementById("formArea").innerHTML = `
    <div class="edit-form"><h3>${m.id ? "Edit model #" + m.id : "New model"}</h3>
      <div class="grid">
        <label>Slug<input id="f_slug" value="${escapeHtml(m.slug)}"></label>
        <label>Name<input id="f_name" value="${escapeHtml(m.name)}"></label>
        <label>Body style<input id="f_bodyStyle" value="${escapeHtml(m.bodyStyle)}"></label>
        <label>Segment<input id="f_segment" value="${escapeHtml(m.segment)}"></label>
      </div>
      <label style="margin-top:10px">Notes (markdown)<textarea id="f_notesMd">${escapeHtml(m.notesMd)}</textarea></label>
      <div class="actions">
        <button class="primary" onclick="saveModel(${m.id || 'null'})">${m.id ? 'Save' : 'Create'}</button>
        <button class="secondary" onclick="document.getElementById('formArea').innerHTML=''">Cancel</button>
      </div></div>`;
}
async function saveModel(id) {
  const data = {
    slug: document.getElementById("f_slug").value.trim(),
    name: document.getElementById("f_name").value.trim(),
    bodyStyle: document.getElementById("f_bodyStyle").value.trim() || null,
    segment: document.getElementById("f_segment").value.trim() || null,
    notesMd: document.getElementById("f_notesMd").value || null,
  };
  await api(id ? `/models/${id}` : "/models", { method: id ? "PATCH" : "POST", body: JSON.stringify(data) });
  render();
}

async function renderTrims() {
  const [{ trims }, { models }, { powertrains }] = await Promise.all([api("/trims"), api("/models"), api("/powertrains")]);
  window._models = models; window._powertrains = powertrains;
  document.getElementById("main").innerHTML = `
    <div class="toolbar"><button class="primary" onclick="openTrimForm()">+ New trim</button></div>
    <table><thead><tr><th>ID</th><th>Slug</th><th>Model</th><th>Year</th><th>Name</th><th>Powertrain</th><th>MSRP</th><th></th></tr></thead>
    <tbody>${trims.map(t => `<tr>
      <td>${t.id}</td><td><code>${t.slug}</code></td><td>${escapeHtml(t.model?.name)}</td>
      <td>${t.year}</td><td>${escapeHtml(t.name)}</td>
      <td><span class="badge">${t.powertrain?.type}</span> ${escapeHtml(t.powertrain?.displayName)}</td>
      <td>$${Number(t.msrpCad).toLocaleString("en-CA")}</td>
      <td class="row-actions">
        <button class="secondary" onclick='openTrimForm(${JSON.stringify(t)})'>edit</button>
        <button class="secondary" onclick='openFeeForm(${t.id})'>fees</button>
        <button class="secondary" onclick="printQuote('${t.slug}')">quote</button>
        <button class="secondary danger" onclick="delItem('trims', ${t.id})">del</button>
      </td></tr>`).join("")}</tbody></table>
    <div id="formArea"></div>`;
}
function openTrimForm(t = {}) {
  const modelOpts = window._models.map(m => `<option value="${m.id}" ${m.id === t.modelId ? "selected" : ""}>${escapeHtml(m.name)}</option>`).join("");
  const ptOpts = window._powertrains.map(p => `<option value="${p.id}" ${p.id === t.powertrainId ? "selected" : ""}>${p.type} — ${escapeHtml(p.displayName)}</option>`).join("");
  document.getElementById("formArea").innerHTML = `
    <div class="edit-form"><h3>${t.id ? "Edit trim #" + t.id : "New trim"}</h3>
      <div class="grid">
        <label>Model<select id="f_modelId">${modelOpts}</select></label>
        <label>Powertrain<select id="f_powertrainId">${ptOpts}</select></label>
        <label>Year<input id="f_year" type="number" value="${t.year || 2026}"></label>
        <label>Name<input id="f_name" value="${escapeHtml(t.name)}"></label>
        <label>Slug<input id="f_slug" value="${escapeHtml(t.slug)}"></label>
        <label>MSRP CAD<input id="f_msrpCad" type="number" step="0.01" value="${t.msrpCad || 0}"></label>
      </div>
      <label style="margin-top:10px">Notes (rep cheat-sheet)<textarea id="f_notesMd">${escapeHtml(t.notesMd)}</textarea></label>
      <div class="actions">
        <button class="primary" onclick="saveTrim(${t.id || 'null'})">${t.id ? 'Save' : 'Create'}</button>
        <button class="secondary" onclick="document.getElementById('formArea').innerHTML=''">Cancel</button>
      </div></div>`;
}
async function printQuote(slug) {
  // Open the HTML quote in a new tab. Token is passed via fetch+blob since
  // the bearer header doesn't survive a top-level navigation.
  const res = await fetch(`/api/v1/trims/${encodeURIComponent(slug)}/quote.html`, {
    headers: { Authorization: "Bearer " + token },
  });
  if (!res.ok) { alert("Failed to render quote"); return; }
  const html = await res.text();
  const w = window.open("", "_blank");
  if (!w) { alert("Allow pop-ups for the quote tab."); return; }
  w.document.write(html);
  w.document.close();
}
async function saveTrim(id) {
  const data = {
    modelId: Number(document.getElementById("f_modelId").value),
    powertrainId: Number(document.getElementById("f_powertrainId").value),
    year: Number(document.getElementById("f_year").value),
    name: document.getElementById("f_name").value.trim(),
    slug: document.getElementById("f_slug").value.trim(),
    msrpCad: Number(document.getElementById("f_msrpCad").value),
    notesMd: document.getElementById("f_notesMd").value || null,
  };
  await api(id ? `/trims/${id}` : "/trims", { method: id ? "PATCH" : "POST", body: JSON.stringify(data) });
  render();
}
function openFeeForm(trimId) {
  document.getElementById("formArea").innerHTML = `
    <div class="edit-form"><h3>Fees for trim #${trimId}</h3>
      <div class="grid">
        <label>Freight & PDI<input id="ff_freight" type="number" step="0.01" value="1930"></label>
        <label>A/C Excise<input id="ff_ac" type="number" step="0.01" value="100"></label>
        <label>OMVIC Fee<input id="ff_omvic" type="number" step="0.01" value="12.50"></label>
        <label>Tire Stewardship<input id="ff_tire" type="number" step="0.01" value="22.40"></label>
        <label>Dealer Admin<input id="ff_admin" type="number" step="0.01" value="499"></label>
        <label>HST Rate<input id="ff_hst" type="number" step="0.001" value="0.13"></label>
        <label>Effective Date<input id="ff_date" type="date" value="${new Date().toISOString().slice(0,10)}"></label>
      </div>
      <div class="actions">
        <button class="primary" onclick="saveFees(${trimId})">Save</button>
        <button class="secondary" onclick="document.getElementById('formArea').innerHTML=''">Cancel</button>
      </div></div>`;
}
async function saveFees(trimId) {
  const data = {
    freightPdiCad: Number(document.getElementById("ff_freight").value),
    acExciseCad: Number(document.getElementById("ff_ac").value),
    omvicFeeCad: Number(document.getElementById("ff_omvic").value),
    tireStewardshipCad: Number(document.getElementById("ff_tire").value),
    dealerAdminCad: Number(document.getElementById("ff_admin").value),
    hstRate: Number(document.getElementById("ff_hst").value),
    effectiveDate: document.getElementById("ff_date").value,
  };
  await api(`/trims/${trimId}/fees`, { method: "PUT", body: JSON.stringify(data) });
  render();
}

async function renderPowertrains() {
  const { powertrains } = await api("/powertrains");
  document.getElementById("main").innerHTML = `
    <div class="toolbar"><button class="primary" onclick="openPtForm()">+ New powertrain</button></div>
    <table><thead><tr><th>ID</th><th>Type</th><th>Display</th><th>HP</th><th>Drivetrain</th><th>Comb L/100</th><th></th></tr></thead>
    <tbody>${powertrains.map(p => `<tr>
      <td>${p.id}</td><td><span class="badge">${p.type}</span></td><td>${escapeHtml(p.displayName)}</td>
      <td>${fmt(p.horsepowerHp)}</td><td>${fmt(p.drivetrain)}</td><td>${fmt(p.fuelEconomyCombL100)}</td>
      <td class="row-actions">
        <button class="secondary" onclick='openPtForm(${JSON.stringify(p)})'>edit</button>
        <button class="secondary danger" onclick="delItem('powertrains', ${p.id})">del</button>
      </td></tr>`).join("")}</tbody></table>
    <div id="formArea"></div>`;
}
function openPtForm(p = {}) {
  const types = ["GAS","HYBRID","PHEV","BEV"];
  document.getElementById("formArea").innerHTML = `
    <div class="edit-form"><h3>${p.id ? "Edit powertrain #" + p.id : "New powertrain"}</h3>
      <div class="grid">
        <label>Type<select id="pf_type">${types.map(t => `<option ${t===p.type?'selected':''}>${t}</option>`).join("")}</select></label>
        <label>Display name<input id="pf_displayName" value="${escapeHtml(p.displayName)}"></label>
        <label>Engine desc<input id="pf_engineDesc" value="${escapeHtml(p.engineDesc)}"></label>
        <label>HP<input id="pf_hp" type="number" value="${p.horsepowerHp || ''}"></label>
        <label>Torque lb-ft<input id="pf_tq" type="number" value="${p.torqueLbft || ''}"></label>
        <label>Transmission<input id="pf_tx" value="${escapeHtml(p.transmission)}"></label>
        <label>Drivetrain<input id="pf_dt" value="${escapeHtml(p.drivetrain)}"></label>
        <label>Battery kWh<input id="pf_bat" type="number" step="0.01" value="${p.batteryKwh || ''}"></label>
        <label>Electric range km<input id="pf_er" type="number" value="${p.electricRangeKm || ''}"></label>
        <label>City L/100<input id="pf_fc" type="number" step="0.1" value="${p.fuelEconomyCityL100 || ''}"></label>
        <label>Hwy L/100<input id="pf_fh" type="number" step="0.1" value="${p.fuelEconomyHwyL100 || ''}"></label>
        <label>Comb L/100<input id="pf_fb" type="number" step="0.1" value="${p.fuelEconomyCombL100 || ''}"></label>
      </div>

async function doSearch() {
  const val = (id) => document.getElementById(id).value.trim();
  const num = (id) => val(id) ? Number(val(id)) : undefined;
  const list = (id) => val(id) ? val(id).split(",").map(s => s.trim().toUpperCase()).filter(Boolean) : undefined;
  const cap = (id) => val(id) ? val(id).split(",").map(s => s.trim()).filter(Boolean) : undefined;
  const selectedColors = [...document.getElementById("s_colors").selectedOptions].map(o => o.value);
  const body = {
    make: val("s_make") || undefined,
    year: num("s_year"),
    bodyStyles: cap("s_body"),
    powertrains: list("s_pt"),
    drivetrainContains: val("s_dt") || undefined,
    colorSlugs: selectedColors.length > 0 ? selectedColors : undefined,
    minHp: num("s_minHp"),
    maxComboL100: num("s_maxFe"),
    minElectricRangeKm: num("s_minER"),
    maxMsrpCad: num("s_maxMsrp"),
    maxTotalCad: num("s_maxTotal"),
    hybridOnly: document.getElementById("s_hybridOnly").checked || undefined,
    awdOnly: document.getElementById("s_awdOnly").checked || undefined,
    sortBy: document.getElementById("s_sort").value,
    sortDir: document.getElementById("s_dir").value,
    limit: 50,
  };
  Object.keys(body).forEach(k => body[k] === undefined && delete body[k]);
  const r = await api("/search", { method: "POST", body: JSON.stringify(body) });
  const fmt = (n) => "$" + Number(n).toLocaleString("en-CA", { minimumFractionDigits: 0, maximumFractionDigits: 0 });
  document.getElementById("searchOut").innerHTML = `
    <div style="margin: 16px 0 8px; color: var(--muted); font-size: 13px;">${r.count} matches</div>
    <table>
      <thead><tr><th>Year</th><th>Model</th><th>Trim</th><th>Powertrain</th><th>HP</th><th>L/100km</th><th>EV km</th><th>MSRP</th><th>OTD</th></tr></thead>

        <td>${fmt(t.msrp)}</td>
        <td><strong>${fmt(t.total)}</strong></td>
      </tr>`).join("")}</tbody>
    </table>`;
}

// ---------- Compare ----------
async function renderCompare() {
  const { trims } = await api("/trims");
  window._allTrims = trims;
  const grouped = {};
  for (const t of trims) (grouped[t.model.name] ??= []).push(t);
  const opts = Object.keys(grouped).sort().map(m =>
    `<optgroup label="${escapeHtml(m)}">${grouped[m].map(t => `<option value="${t.slug}">${t.year} ${escapeHtml(t.name)} — $${Number(t.msrpCad).toLocaleString("en-CA")}</option>`).join("")}</optgroup>`
  ).join("");
  document.getElementById("main").innerHTML = `
    <div class="edit-form">
      <h3 style="margin-top:0">Side-by-side trim comparison</h3>
      <div class="grid">
        ${[0,1,2,3].map(i => `<label>Trim ${i+1}<select id="cmp_${i}"><option value="">— none —</option>${opts}</select></label>`).join("")}
      </div>
      <div class="actions"><button class="primary" onclick="doCompare()">Compare</button></div>
    </div>
    <div id="compareOut"></div>`;
}
async function doCompare() {
  const slugs = [0,1,2,3].map(i => document.getElementById(`cmp_${i}`).value).filter(Boolean);
  if (slugs.length < 2) { alert("Pick at least 2 trims."); return; }
  const r = await api("/compare", { method: "POST", body: JSON.stringify({ trimSlugs: slugs }) });
  const rows = r.trims;
  const fmtMoney = (n) => "$" + Number(n).toLocaleString("en-CA", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const headerCells = rows.map(t => `<th>${escapeHtml(t.model.name)}<br><span style="font-weight: 400; color: var(--muted);">${t.year} ${escapeHtml(t.name)}</span></th>`).join("");
  const row = (label, fn) => `<tr><th>${label}</th>${rows.map(t => `<td>${fn(t)}</td>`).join("")}</tr>`;
  const w = r.warrantyByModelYear;
  const findW = (t, type) => (w[`${t.model.slug}|${t.year}`] || []).find(x => x.coverageType === type);
  const fmtW = (cov) => cov ? `${cov.durationMonths}mo / ${cov.distanceKm ? cov.distanceKm.toLocaleString("en-CA")+"km" : "unlimited"}` : "—";
  document.getElementById("compareOut").innerHTML = `
    <table style="margin-top:16px">
      <thead><tr><th></th>${headerCells}</tr></thead>
      <tbody>
        ${row("MSRP", t => fmtMoney(t.quote.msrp))}
        ${row("Out-the-door (HST in)", t => `<strong>${fmtMoney(t.quote.total)}</strong>`)}
        ${row("Powertrain", t => `<span class="badge">${t.powertrain.type}</span> ${escapeHtml(t.powertrain.displayName)}`)}
        ${row("HP / Torque", t => `${t.powertrain.horsepowerHp || "—"} hp / ${t.powertrain.torqueLbft || "—"} lb-ft`)}
        ${row("Drivetrain", t => escapeHtml(t.powertrain.drivetrain || "—"))}
        ${row("Combined L/100km", t => t.powertrain.fuelEconomyCombL100 ?? "—")}
        ${row("Electric range (km)", t => t.powertrain.electricRangeKm ?? "—")}
        ${row("Basic warranty", t => fmtW(findW(t,"BASIC")))}
        ${row("Powertrain warranty", t => fmtW(findW(t,"POWERTRAIN")))}
        ${row("Hybrid battery", t => fmtW(findW(t,"HYBRID_BATTERY")))}
        ${row("Corrosion", t => fmtW(findW(t,"CORROSION_PERFORATION")))}
      </tbody>
    </table>
    ${r.missing && r.missing.length > 0 ? `<div class="empty danger">Not found: ${r.missing.join(", ")}</div>` : ""}`;
}

      <h4 style="margin:18px 0 6px;font-size:13px;">History</h4>
      <table><thead><tr><th>When</th><th>Kind</th><th>Notes</th></tr></thead>
      <tbody>${c.interactions.map(i => `<tr>
        <td style="white-space:nowrap">${new Date(i.createdAt).toLocaleString()}</td>
        <td><span class="badge">${i.kind}</span></td>
        <td>${escapeHtml(i.bodyMd)}</td>
      </tr>`).join("")}</tbody></table>
      <div class="actions" style="margin-top:14px">
        <button class="secondary" onclick='openCustomerForm(${JSON.stringify(c)})'>Edit</button>
        <button class="secondary" onclick="document.getElementById('customerArea').innerHTML=''">Close</button>
      </div>
    </div>`;
}
async function logInteraction(customerId) {
  const kind = document.getElementById("ci_kind").value;
  const bodyMd = document.getElementById("ci_body").value.trim();
  if (!bodyMd) return;
  await api(`/customers/${customerId}/interactions`, { method: "POST", body: JSON.stringify({ kind, bodyMd }) });
  openCustomer(customerId);
}

// ---------- Maintenance ----------
async function renderMaintenance() {
  const { models } = await api("/models");
  const opts = models.map(m => `<option value="${m.slug}">${escapeHtml(m.make || 'Toyota')} ${escapeHtml(m.name)}</option>`).join("");
  document.getElementById("main").innerHTML = `
    <div class="edit-form">
      <h3 style="margin-top:0">Maintenance cost projection</h3>
      <div class="grid">
        <label>Model<select id="mt_model">${opts}</select></label>
        <label>Starting km<input id="mt_start" type="number" value="0"></label>
        <label>Target km<input id="mt_target" type="number" value="200000"></label>
        <label>Labour rate $/hr<input id="mt_rate" type="number" value="180"></label>
      </div>
      <div class="actions">
        <button class="primary" onclick="projectMaintenance()">Project</button>
      </div>
      <div id="mtOut"></div>
    </div>`;
}
async function projectMaintenance() {
  const r = await api("/maintenance/project", { method: "POST", body: JSON.stringify({
    modelSlug: document.getElementById("mt_model").value,
    startingKm: Number(document.getElementById("mt_start").value || 0),
    targetKm: Number(document.getElementById("mt_target").value),
    labourRateCad: Number(document.getElementById("mt_rate").value || 180),
  })});
  const fmt = (n) => "$" + Number(n).toLocaleString("en-CA", { minimumFractionDigits: 2 });
  document.getElementById("mtOut").innerHTML = `
    <div style="margin-top:16px">
      <div style="display:flex;gap:18px;margin-bottom:14px;">
        <div><span style="color:var(--muted);font-size:11px;text-transform:uppercase">Visits</span><div style="font-size:22px;font-weight:700">${r.totals.visits}</div></div>
        <div><span style="color:var(--muted);font-size:11px;text-transform:uppercase">Parts</span><div style="font-size:22px;font-weight:700">${fmt(r.totals.parts)}</div></div>
        <div><span style="color:var(--muted);font-size:11px;text-transform:uppercase">Labour</span><div style="font-size:22px;font-weight:700">${fmt(r.totals.labour)}</div></div>
        <div><span style="color:var(--muted);font-size:11px;text-transform:uppercase">Total</span><div style="font-size:22px;font-weight:700;color:var(--accent)">${fmt(r.totals.total)}</div></div>
      </div>
      <table>
        <thead><tr><th>At km</th><th>Interval</th><th>Services</th><th>Parts</th><th>Labour</th></tr></thead>
        <tbody>${r.lineItems.map(li => `<tr>
          <td>${li.km.toLocaleString("en-CA")}</td>
          <td>${li.intervalKm.toLocaleString("en-CA")} km</td>
          <td>${escapeHtml(li.services.join(", "))}</td>
          <td>${fmt(li.partsCost)}</td>
          <td>${fmt(li.labourCost)}</td>
        </tr>`).join("")}</tbody>
      </table>
    </div>`;
}

// ---------- Scraper ----------
async function renderScrape() {
  const { runs } = await api("/admin/scrape/runs");
  const runsHtml = runs.length === 0
    ? `<div class="empty">No scrape runs yet.</div>`
    : `<table><thead><tr><th>Run #</th><th>Source</th><th>Started</th><th>Finished</th><th>Status</th><th>Diffs</th><th></th></tr></thead>
       <tbody>${runs.map(r => `<tr>
         <td>${r.id}</td><td>${escapeHtml(r.source)}</td>
         <td>${new Date(r.startedAt).toLocaleString()}</td>
         <td>${r.finishedAt ? new Date(r.finishedAt).toLocaleString() : '<em>running…</em>'}</td>
         <td><span class="badge">${r.status}</span></td>
         <td>${r._count?.diffs ?? 0}</td>
         <td class="row-actions">
           <button class="secondary" onclick="reviewRun(${r.id})">review</button>
         </td></tr>`).join("")}</tbody></table>`;
  document.getElementById("main").innerHTML = `
    <div class="toolbar">
      <input id="scrapeModels" placeholder="model slugs (comma, blank = all)" style="width: 320px;">
      <button class="primary" onclick="runScrape()">Run scraper</button>
      <span style="color: var(--muted); font-size: 12px;">Spawns the Playwright child process. Polite delay ~3s/page. Results written to scrape_diffs for review — never directly to live tables.</span>
    </div>
    ${runsHtml}
    <div id="diffArea"></div>`;
}
async function runScrape() {
  const raw = document.getElementById("scrapeModels").value.trim();
  const body = raw ? { models: raw.split(",").map(s => s.trim()).filter(Boolean) } : {};
  const r = await api("/admin/scrape/run", { method: "POST", body: JSON.stringify(body) });
  alert(`Scrape run #${r.runId} started. Refresh in ~1 minute to review diffs.`);
  setTimeout(render, 2000);
}
async function reviewRun(runId) {
  const { diffs } = await api(`/admin/scrape/runs/${runId}/diffs`);
  if (diffs.length === 0) {
    document.getElementById("diffArea").innerHTML = `<div class="edit-form"><h3>Run #${runId}: no diffs</h3><div class="empty">Either nothing changed, or the scraper is still running.</div></div>`;
    return;
  }
  document.getElementById("diffArea").innerHTML = `
    <div class="edit-form">
      <h3>Run #${runId}: ${diffs.length} diffs</h3>
      <table>
        <thead><tr><th>#</th><th>Table</th><th>Record</th><th>Field</th><th>Old → New</th><th>Decision</th></tr></thead>
        <tbody>${diffs.map(d => `<tr>
          <td>${d.id}</td>
          <td><span class="badge">${d.tableName}</span></td>
          <td><code>${escapeHtml(d.recordPk)}</code></td>
          <td>${escapeHtml(d.field)}</td>
          <td><span style="color: var(--muted);">${escapeHtml(d.oldValue) || '—'}</span> → <strong>${escapeHtml(d.newValue) || '—'}</strong></td>
          <td>
            <select onchange="setDecision(${d.id}, this.value)">
              <option value="PENDING" ${d.decision==='PENDING'?'selected':''}>PENDING</option>
              <option value="ACCEPT" ${d.decision==='ACCEPT'?'selected':''}>ACCEPT</option>
              <option value="REJECT" ${d.decision==='REJECT'?'selected':''}>REJECT</option>
            </select>
          </td></tr>`).join("")}</tbody>
      </table>
      <div class="actions">
        <button class="primary" onclick="applyRun(${runId})">Apply accepted diffs</button>
        <button class="secondary" onclick="bulkDecide(${runId}, 'ACCEPT')">Accept all</button>
        <button class="secondary" onclick="bulkDecide(${runId}, 'REJECT')">Reject all</button>
        <button class="secondary" onclick="document.getElementById('diffArea').innerHTML=''">Close</button>
      </div>
    </div>`;
}
const _pendingDecisions = new Map();
function setDecision(diffId, decision) { _pendingDecisions.set(diffId, decision); }
async function bulkDecide(runId, decision) {
  const { diffs } = await api(`/admin/scrape/runs/${runId}/diffs`);
  const decisions = diffs.map(d => ({ diffId: d.id, decision }));
  await api(`/admin/scrape/runs/${runId}/diffs`, { method: "PATCH", body: JSON.stringify({ decisions }) });
  reviewRun(runId);
}
async function applyRun(runId) {
  // Flush any pending dropdown changes first
  if (_pendingDecisions.size > 0) {
    const decisions = [..._pendingDecisions.entries()].map(([diffId, decision]) => ({ diffId, decision }));
    await api(`/admin/scrape/runs/${runId}/diffs`, { method: "PATCH", body: JSON.stringify({ decisions }) });
    _pendingDecisions.clear();
  }
  const r = await api(`/admin/scrape/runs/${runId}/apply`, { method: "POST" });
  alert(`Applied ${r.applied} diff(s) to the catalog. Catalog version bumped — AI prompt cache invalidated.`);
  render();
}

async function delItem(resource, id) {
  if (!confirm("Delete " + resource + " #" + id + "?")) return;
  await api(`/${resource}/${id}`, { method: "DELETE" });
  render();
}

window.addEventListener("hashchange", () => {
  currentTab = location.hash.replace("#", "") || "ai";
  render();
});

updateTokenStatus();
if (!token) { document.getElementById("tokenDialog").showModal(); }
render();
</script>
