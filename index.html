<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- `viewport-fit=cover` is what lets the game paint under the notch; the
         HUD keeps clear of it with `env(safe-area-inset-*)`. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <!-- Added to a home screen, it opens without browser chrome. On a phone
         held sideways that chrome is a sixth of the screen, and this game has
         390 points of height to work with. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Emerald Isle" />
    <meta name="theme-color" content="#0c0f0d" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Emerald Isle</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23243a1e'/><path d='M16 5l3.2 6.8 7.3.9-5.4 5 1.4 7.2L16 21.4 9.5 24.9l1.4-7.2-5.4-5 7.3-.9z' fill='%23c9a84c'/></svg>"
    />
    <link rel="stylesheet" href="/src/render/hud.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
